<svg xmlns="http://www.w3.org/2000/svg" width="460" height="214" viewBox="0 0 460 214" role="img" aria-label="Discord presence preview: listening to Midnight Drive by Neon Coast, with a made by xr7uz badge">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa2d48"/>
      <stop offset="0.55" stop-color="#c13584"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="artClip">
      <rect x="20" y="50" width="96" height="96" rx="10"/>
    </clipPath>
    <clipPath id="badgeClip">
      <circle cx="110" cy="140" r="12"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: "gg sans", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font-size: 12px; font-weight: 700; fill: #b5bac1; letter-spacing: 0.02em; }
    .title { font-size: 16px; font-weight: 700; fill: #f2f3f5; }
    .text  { font-size: 14px; fill: #dbdee1; }
    .muted { font-size: 13px; fill: #949ba4; }
    .time  { font-size: 12px; fill: #b5bac1; font-variant-numeric: tabular-nums; }
    .btn   { font-size: 13px; font-weight: 600; fill: #ffffff; }
  </style>

  <rect x="0.5" y="0.5" width="459" height="213" rx="14" fill="#111214" stroke="#2b2d31"/>

  <text x="20" y="32" class="label">Listening to Music</text>

  <!-- cover art -->
  <g clip-path="url(#artClip)">
    <rect x="20" y="50" width="96" height="96" fill="url(#art)"/>
    <circle cx="68" cy="98" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
    <circle cx="68" cy="98" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>
  </g>
  <g fill="#ffffff">
    <ellipse cx="58" cy="117" rx="9" ry="7" transform="rotate(-20 58 117)"/>
    <ellipse cx="84" cy="111" rx="9" ry="7" transform="rotate(-20 84 111)"/>
    <rect x="64" y="76" width="3.5" height="42"/>
    <rect x="90" y="70" width="3.5" height="42"/>
    <path d="M64 76 L93.5 70 L93.5 78 L64 84 Z"/>
  </g>

  <!-- made by xr7uz badge -->
  <circle cx="110" cy="140" r="15" fill="#111214"/>
  <image href="data:image/jpeg;base64," x="98" y="128" width="24" height="24" clip-path="url(#badgeClip)"/>

  <text x="132" y="72" class="title">Midnight Drive</text>
  <text x="132" y="94" class="text">Neon Coast</text>
  <text x="132" y="114" class="muted">Afterglow</text>

  <!-- progress -->
  <text x="132" y="140" class="time">1:24</text>
  <rect x="166" y="133" width="226" height="4" rx="2" fill="#4e5058"/>
  <rect x="166" y="133" width="90" height="4" rx="2" fill="#f2f3f5"/>
  <text x="440" y="140" class="time" text-anchor="end">3:31</text>

  <!-- buttons -->
  <rect x="20" y="164" width="206" height="32" rx="8" fill="#4e5058"/>
  <text x="123" y="185" class="btn" text-anchor="middle">Listen on Apple Music</text>
  <rect x="234" y="164" width="206" height="32" rx="8" fill="#4e5058"/>
  <text x="337" y="185" class="btn" text-anchor="middle">Search on Spotify</text>
</svg>
